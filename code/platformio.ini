[platformio]
default_envs = esp32c3_supermini
src_dir = code
data_dir = data

[env]
framework = arduino
board_build.filesystem = littlefs
build_src_filter = +<*.cpp> -<old/>
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  knolleary/PubSubClient@2.8
  adafruit/RTClib@2.1.4
  adafruit/Adafruit BusIO@1.16.1

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv

[env:esp32c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

# ESP32-C3 SuperMini compatible build profile. It uses the C3 chip target and
# FeedMate's C3 GPIO map; verify external wiring against the exact board clone.
[env:esp32c3_supermini]
extends = env:esp32c3

[env:esp32c6]
platform = espressif32@8.0.0
board = esp32-c6-devkitc-1
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s2]
platform = espressif32@8.0.0
board = esp32-s2-saola-1
board_build.partitions = huge_app.csv

[env:esp32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
build_flags = -Wno-sign-compare
