name: Firmware and controller checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0
      - run: pio run -e esp32dev -e d1_mini
      - run: pio run -e esp32dev -e d1_mini -t buildfs
      - run: g++ -std=c++17 tests/controller_test.cpp -o /tmp/controller-test && TZ=UTC /tmp/controller-test
